server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fallback SPA: kalau path tidak cocok file/folder fisik, tetap kirim
    # index.html - baru Vue Router (createWebHistory) yang menentukan
    # halaman mana yang dirender berdasarkan URL tsb. Ini yang mengatasi
    # 404 saat reload halaman selain "/".
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache aset statis hasil build (sudah ada hash di nama file dari Vite,
    # jadi aman di-cache lama)
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}
